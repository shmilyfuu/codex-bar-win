[package]
name = "codex-bar-win"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
build = "build.rs"
description = "Minimal Windows tray utility for viewing Codex usage"
license = "MIT"
repository = "https://github.com/shmilyfuu/codex-bar-win"

[dependencies]
async-channel = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui-kit = "0.6"
raw-window-handle = "0.6"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
ico = "0.5"
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
