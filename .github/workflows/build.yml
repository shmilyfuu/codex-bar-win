name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply final Clippy fixes once
        if: github.event_name == 'pull_request' && github.head_ref == 'mvp-tray-usage'
        shell: pwsh
        run: |
          git fetch origin "${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
          @'
          from pathlib import Path

          path = Path("src/windows_app.rs")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "    let embedded = LoadIconW(instance, 1usize as *const u16);",
                  "    let embedded = LoadIconW(instance, std::ptr::without_provenance::<u16>(1usize));",
              ),
              (
                  '''    let mut icon = NOTIFYICONDATAW::default();
              icon.cbSize = size_of::<NOTIFYICONDATAW>() as u32;
              icon.hWnd = hwnd;
              icon.uID = TRAY_ID;
              icon.uFlags = NIF_MESSAGE | NIF_ICON | NIF_TIP;
              icon.uCallbackMessage = WM_TRAY;
              icon.hIcon = app_icon;''',
                  '''    let mut icon = NOTIFYICONDATAW {
                  cbSize: size_of::<NOTIFYICONDATAW>() as u32,
                  hWnd: hwnd,
                  uID: TRAY_ID,
                  uFlags: NIF_MESSAGE | NIF_ICON | NIF_TIP,
                  uCallbackMessage: WM_TRAY,
                  hIcon: app_icon,
                  ..Default::default()
              };''',
              ),
              (
                  '''    let mut icon = NOTIFYICONDATAW::default();
              icon.cbSize = size_of::<NOTIFYICONDATAW>() as u32;
              icon.hWnd = hwnd;
              icon.uID = TRAY_ID;
              Shell_NotifyIconW(NIM_DELETE, &icon);''',
                  '''    let icon = NOTIFYICONDATAW {
                  cbSize: size_of::<NOTIFYICONDATAW>() as u32,
                  hWnd: hwnd,
                  uID: TRAY_ID,
                  ..Default::default()
              };
              Shell_NotifyIconW(NIM_DELETE, &icon);''',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected Clippy-fix source snippet not found: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          '@ | python -
          cargo fmt --all

          if (-not (git status --porcelain -- 'src/windows_app.rs')) {
            Write-Host "Clippy fixes are already applied."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/windows_app.rs
          git commit -m "fix: satisfy final Windows Clippy checks"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: codex-bar-win-x64-portable
          path: target/release/codex-bar-win.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read Cargo version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download portable executable
        uses: actions/download-artifact@v4
        with:
          name: codex-bar-win-x64-portable
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          gh release create "$TAG" release/codex-bar-win.exe \
            --target "$GITHUB_SHA" \
            --title "codex-bar-win $TAG" \
            --generate-notes
