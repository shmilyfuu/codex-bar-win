name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply rustfmt once to release branch
        if: github.event_name == 'pull_request' && github.head_ref == 'mvp-tray-usage'
        shell: pwsh
        run: |
          git fetch origin "${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
          cargo fmt --all
          if (-not (git status --porcelain -- '*.rs')) {
            Write-Host "Rust sources are already formatted."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: apply rustfmt"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: codex-bar-win-x64-portable
          path: target/release/codex-bar-win.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read Cargo version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download portable executable
        uses: actions/download-artifact@v4
        with:
          name: codex-bar-win-x64-portable
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          gh release create "$TAG" release/codex-bar-win.exe \
            --target "$GITHUB_SHA" \
            --title "codex-bar-win $TAG" \
            --generate-notes
